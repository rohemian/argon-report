<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heeyun's Argon · 데일리 퀀트 카드뉴스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --ink:#101318;        /* 그라파이트 바탕 */
  --plate:#191d24;      /* 강철판 */
  --plate2:#20262f;
  --rule:#2d343f;       /* 리벳 라인 */
  --text:#ebe7df;       /* 웜 화이트 */
  --mute:#8d96a5;
  --amber:#f4a62a;      /* 에디슨 필라멘트 */
  --amber2:#ffcf7a;
  --argon:#9b8cff;      /* 아르곤 글로우 */
  --up:#22c55e; --down:#f97316;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0c10;color:var(--text);font-family:'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
body{padding:0 0 40px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* ---------- 네비게이션 ---------- */
.nav{position:sticky;top:0;z-index:50;background:rgba(10,12,16,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.nav-in{width:840px;max-width:100%;margin:0 auto;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nav .brand{font-weight:900;font-size:14px;margin-right:auto;color:var(--amber)}
.nav .brand small{color:var(--mute);font-weight:500;margin-left:6px;font-size:11px}
.btn{font:700 12px 'Noto Sans KR';color:var(--text);background:var(--plate2);border:1px solid var(--rule);border-radius:8px;padding:7px 10px;cursor:pointer}
.btn:hover{border-color:var(--amber)}
.btn:focus-visible{outline:2px solid var(--amber2);outline-offset:2px}
.btn.pri{background:var(--amber);color:#1a1205;border-color:var(--amber)}
.live{font:600 11px var(--mono);color:var(--mute);width:100%;display:flex;gap:10px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:#555;display:inline-block}
.dot.on{background:var(--up);box-shadow:0 0 8px var(--up)}
/* ---------- 카드 ---------- */
.card{width:840px;margin:22px auto 0;background:var(--ink);border:1px solid var(--rule);border-radius:22px;overflow:hidden;position:relative}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(600px 220px at 85% -40px,rgba(244,166,42,.16),transparent 70%),radial-gradient(500px 200px at 0% 0%,rgba(155,140,255,.08),transparent 70%)}
.pad{padding:26px 28px;position:relative}
.head{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px;padding-bottom:16px;border-bottom:1px dashed var(--rule)}
.eyebrow{font:700 12px var(--mono);letter-spacing:.14em;color:var(--amber);text-transform:uppercase}
.eyebrow b{display:inline-block;background:var(--amber);color:#1a1205;padding:2px 7px;border-radius:5px;margin-right:8px}
h1{font-size:32px;font-weight:900;letter-spacing:-.03em;line-height:1.15;margin-top:8px}
h1 em{font-style:normal;color:var(--amber2)}
.stamp{text-align:right;font:600 11px/1.6 var(--mono);color:var(--mute)}
.stamp strong{color:var(--text);font-size:13px;display:block}
h2{font-size:17px;font-weight:900;margin:22px 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:-.02em}
h2::before{content:"";width:4px;height:17px;background:var(--amber);border-radius:2px}
h2 small{font-weight:500;color:var(--mute);font-size:12px;margin-left:auto}
/* ---------- 상단 3단 (Flexbox 붕괴 방지: 고정 grid) ---------- */
.top3{display:grid;grid-template-columns:180px 240px 1fr;gap:12px;margin-top:18px}
.gauge{background:var(--plate);border:1px solid var(--rule);border-radius:16px;padding:14px;text-align:center;min-width:0}
.gauge .lbl{font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap}
.dial{position:relative;width:132px;height:132px;margin:8px auto 4px}
.dial svg{width:132px;height:132px;transform:rotate(-90deg)}
.dial .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .v span{font:700 40px var(--mono);letter-spacing:-.05em;line-height:1}
.dial .v i{font-style:normal;font:600 11px var(--mono);color:var(--mute)}
.grade{font-size:12px;font-weight:700;white-space:nowrap}
.gauge.dual .dial{width:76px;height:76px;margin:6px auto 0}
.gauge.dual .dial svg{width:76px;height:76px}
.gauge.dual .dial .v span{font-size:24px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.duo .lbl{font-size:11px}
.parts{background:var(--plate);border:1px solid var(--rule);border-radius:16px;padding:12px 14px;min-width:0}
.parts .ttl{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px}
.prow{display:grid;grid-template-columns:1fr 52px;gap:6px;align-items:center;font-size:12px;margin-top:7px}
.prow .bar{grid-column:1/3;height:5px;background:#0d1015;border-radius:3px;overflow:hidden}
.prow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--amber2))}
.prow .s{text-align:right;font:600 12px var(--mono);color:var(--amber2)}
.diag{background:var(--plate);border:1px solid var(--rule);border-radius:16px;padding:12px 14px;min-width:0}
.diag .ttl{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:4px}
.cause{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--rule);font-size:13px;line-height:1.5}
.cause:first-of-type{border-top:0}
.cause b{font:700 11px var(--mono);color:#1a1205;background:var(--amber);border-radius:5px;text-align:center;height:20px;line-height:20px}
.cause.w b{background:#3b3f4a;color:var(--amber2)} .cause.a b{background:var(--argon);color:#120e2a}
/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.kpis.six{grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--plate);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .k{font-size:12px;color:var(--mute);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font:700 21px var(--mono);margin-top:4px;white-space:nowrap;letter-spacing:-.03em}
.kpi .s{font-size:11.5px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{color:var(--up)} .dn{color:var(--down)} .fl{color:var(--mute)}
/* ---------- 매크로 블록 ---------- */
.vars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vbox{background:var(--plate);border:1px solid var(--rule);border-radius:14px;padding:14px;min-width:0;display:flex;flex-direction:column}
.vbox .t{font-size:15px;font-weight:900}
.vbox .tag{display:inline-block;margin-top:6px;font:600 11px var(--mono);color:var(--amber2);border:1px solid rgba(244,166,42,.4);border-radius:20px;padding:2px 8px;align-self:flex-start}
.vbox p{font-size:12.5px;line-height:1.62;color:#cdd2da;margin-top:8px;flex:1}
.vbox .k{margin-top:10px;font-size:12px;font-weight:700;color:var(--argon);border-top:1px dashed var(--rule);padding-top:8px}
.trend .st{font-size:12px;color:var(--amber2);font-weight:700;margin-top:4px}
.secT{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;background:var(--plate);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.secT th,.secT td{padding:10px 12px;text-align:left;border-top:1px solid var(--rule);line-height:1.5;vertical-align:top}
.secT thead th{border-top:0;background:var(--plate2);font-size:12px;color:var(--mute)}
.secT td:first-child{font-weight:900;width:110px;white-space:nowrap}
/* ---------- 4×5 고정 그리드 히트맵 ---------- */
.heat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{height:76px;border-radius:10px;border:1.5px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:0;padding:0 6px;overflow:hidden}
.tile .n{font-size:13.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.3}
.tile .c{font:600 10.5px var(--mono);opacity:.75;line-height:1.3}
.tile .p{font:700 12px var(--mono);white-space:nowrap;line-height:1.4}
.t-su{background:#047857;border-color:#10b981}.t-u{background:#15803d;border-color:#22c55e}.t-f{background:#334155;border-color:#64748b}
.t-d{background:#c2410c;border-color:#f97316}.t-sd{background:#9a3412;border-color:#ea580c}
.legend{display:flex;gap:10px;justify-content:flex-end;font-size:11px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* ---------- 액션 플랜 표 ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;background:var(--plate);border:1px solid var(--rule);border-radius:14px;overflow:hidden;table-layout:fixed}
.tbl th{background:var(--plate2);color:var(--mute);font-size:11px;font-weight:700;padding:8px 6px;text-align:right;white-space:nowrap}
.tbl td{padding:8px 6px;border-top:1px solid var(--rule);text-align:right;vertical-align:middle}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:12px}
.tbl th:last-child,.tbl td:last-child{text-align:left;padding-right:12px}
.tbl .nm{font-weight:900;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .cd{font:600 10px var(--mono);color:var(--mute)}
.tbl .m{font:600 11.5px var(--mono);white-space:nowrap}
.tbl .m small{display:block;font-size:10px;color:var(--mute)}
.tbl .ent{color:var(--amber2)}
.tbl .tp{color:var(--up)} .tbl .sl{color:var(--down)}
.rr{display:inline-block;font:700 10.5px var(--mono);background:rgba(155,140,255,.16);color:var(--argon);border-radius:5px;padding:1px 5px;margin-top:2px}
.tbl .why{font-size:11px;line-height:1.45;color:#c9ced6}
.rank{display:inline-block;width:18px;height:18px;border-radius:5px;background:#2b313b;color:var(--amber2);font:700 10.5px/18px var(--mono);text-align:center;margin-right:6px;vertical-align:1px}
.note{font-size:11px;color:var(--mute);line-height:1.6;margin-top:10px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:12px;border-top:1px dashed var(--rule);font:600 10.5px var(--mono);color:var(--mute)}
.foot b{color:var(--amber)}
/* ---------- 크립토 온체인 ---------- */
.chain{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.chain>div{background:var(--plate2);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;min-width:0}
.chain .k{font-size:11px;color:var(--mute);font-weight:700}
.chain .v{font:700 16px var(--mono);margin-top:2px;color:var(--argon)}
.chain .s{font-size:11px;color:#c3c8d0;margin-top:2px;line-height:1.4}
/* ---------- Argon ---------- */
.mid2{display:grid;grid-template-columns:330px 1fr;gap:12px}
.alloc{background:var(--plate);border:1px solid var(--rule);border-radius:16px;padding:14px}
.stack{display:flex;height:26px;border-radius:8px;overflow:hidden;margin:8px 0 12px}
.stack i{display:block;height:100%}
.arow{display:grid;grid-template-columns:12px 1fr 58px;gap:8px;align-items:center;font-size:12.5px;padding:5px 0;border-top:1px solid var(--rule)}
.arow:first-of-type{border-top:0}
.arow .sw{width:12px;height:12px;border-radius:3px}
.arow .w{text-align:right;font:700 12.5px var(--mono)}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rule{background:var(--plate);border:1px solid var(--rule);border-radius:14px;padding:13px 14px;position:relative;overflow:hidden}
.rule .no{font:700 30px var(--mono);color:rgba(244,166,42,.18);position:absolute;right:10px;top:2px}
.rule h4{font-size:14px;font-weight:900;color:var(--amber2);padding-right:40px}
.rule p{font-size:12px;line-height:1.55;color:#c9ced6;margin-top:6px}
.st{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 6px;white-space:nowrap}
.st.wait{background:#2b313b;color:var(--amber2)} .st.hit{background:#047857;color:#eafff3}
.gap{font:600 10px var(--mono);color:var(--mute);display:block;margin-top:2px}
.disc{font-size:10.5px;color:#6b7381;line-height:1.6;margin-top:10px}
@media (max-width:860px){.card{border-radius:0;border-left:0;border-right:0}}
@media (prefers-reduced-motion:no-preference){.prow .bar i{transition:width .8s ease}}
.only .nav{display:none}.only .card{margin-top:0}.only body,.only{padding:0}
/* ===== v2: 점수 기준 · 눈금자 · 트리맵 · 글로벌 보드 ===== */
.gauge .hist{margin-top:8px;font-size:11px;line-height:1.5;color:var(--mute);border-top:1px dashed var(--rule);padding-top:7px}
.gauge .hist b{color:var(--text);font-family:var(--mono)}
.prow .rule-t{grid-column:1/3;font-size:10.5px;color:#7c8594;line-height:1.35;margin-top:-1px}
.scale{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;margin-top:12px;background:var(--plate);border:1px solid var(--rule);border-radius:14px;padding:12px 16px}
.scale .lab{font-size:12px;font-weight:900;line-height:1.45}
.scale .lab small{display:block;font-weight:500;color:var(--mute);font-size:11px}
.sbar{position:relative;height:44px}
.sbar .zones{position:absolute;left:0;right:0;top:8px;height:10px;display:grid;grid-template-columns:40fr 15fr 15fr 30fr;gap:2px}
.sbar .zones i{border-radius:3px}
.sbar .zl{position:absolute;top:22px;font-size:10.5px;color:var(--mute);white-space:nowrap;transform:translateX(-50%)}
.sbar .mk{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.sbar .mk span{font:700 10px var(--mono);padding:0 4px;border-radius:4px;line-height:14px;margin-top:-16px}
.sbar .mk i{width:3px;height:26px;border-radius:2px}
.sbar .avg i{background:#e2e8f0;opacity:.55;width:2px} .sbar .avg span{color:var(--mute)}
.sbar .now i{background:var(--amber2)} .sbar .now span{background:var(--amber);color:#1a1205}
.rl{position:relative;height:22px;margin-top:8px}
.rl .zs{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:1px}
.rl .zs i{display:block;height:100%}
.rl .pin{position:absolute;top:-3px;width:3px;height:12px;background:#fff;border-radius:2px;transform:translateX(-50%);box-shadow:0 0 0 2px var(--ink)}
.rl .zt{display:flex;margin-top:3px;font-size:9.5px;color:#7c8594;white-space:nowrap}
.rl .zt span{overflow:hidden;text-overflow:clip;text-align:center}
.rl .zt span.on{color:var(--text);font-weight:700}
.z-g{background:#166534}.z-n{background:#475569}.z-w{background:#b45309}.z-b{background:#9a3412}
/* treemap */
.tm{position:relative;border-radius:12px;overflow:hidden;background:#0b0d11}
.tm .tl{position:absolute;border:1px solid #0b0d11;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;color:#fff;padding:2px}
.tm .tl .n{font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tm .tl .c{font:600 10px var(--mono);opacity:.7;line-height:1.3;white-space:nowrap}
.tm .tl .p{font-family:var(--mono);font-weight:700;line-height:1.3;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tm .sec{position:absolute;border:2px solid #0b0d11;overflow:hidden}
.tm .sec .sh{position:absolute;left:0;right:0;top:0;height:20px;background:rgba(8,10,14,.72);font-size:11px;font-weight:900;padding:0 7px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;z-index:2}
.tm .sec .sh b{font-family:var(--mono);margin-left:auto}
.tm .sec .tl{border-width:1px;border-color:rgba(11,13,17,.85)}
.c-su{background:#047857;box-shadow:inset 0 0 0 1px #10b981}.c-u{background:#15803d;box-shadow:inset 0 0 0 1px #22c55e}.c-f{background:#334155;box-shadow:inset 0 0 0 1px #64748b}
.c-d{background:#c2410c;box-shadow:inset 0 0 0 1px #f97316}.c-sd{background:#9a3412;box-shadow:inset 0 0 0 1px #ea580c}
.tmwrap{display:grid;grid-template-columns:1fr 236px;gap:12px}
.rank-l{background:var(--plate);border:1px solid var(--rule);border-radius:14px;padding:12px 14px}
.rank-l .ttl{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px}
.rk{display:grid;grid-template-columns:1fr 56px;font-size:12px;padding:5px 0;border-top:1px solid var(--rule);gap:2px}
.rk:first-of-type{border-top:0}
.rk .b{grid-column:1/3;height:4px;background:#0d1015;border-radius:2px;position:relative}
.rk .b i{position:absolute;top:0;height:100%;border-radius:2px}
.rk .v{text-align:right;font:700 12px var(--mono)}
.insight{margin-top:10px;background:linear-gradient(90deg,rgba(155,140,255,.14),transparent);border-left:3px solid var(--argon);border-radius:0 10px 10px 0;padding:10px 14px;font-size:12.5px;line-height:1.6}
.insight b{color:var(--argon)}
/* global board */
.world{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.reg{background:var(--plate);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;min-width:0}
.reg .t{font-size:13px;font-weight:900;margin-bottom:4px;display:flex;justify-content:space-between}
.reg .t small{font:600 10px var(--mono);color:var(--mute);font-weight:600}
.ix{display:grid;grid-template-columns:1fr 54px 58px;gap:4px;align-items:center;font-size:12px;padding:5px 0;border-top:1px solid var(--rule)}
.ix:first-of-type{border-top:0}
.ix .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ix .d,.ix .m{text-align:right;font:700 11.5px var(--mono)}
.ix .m{border-radius:5px;padding:1px 4px}
.m-up{background:rgba(34,197,94,.14);color:#4ade80}.m-dn{background:rgba(249,115,22,.16);color:#fb923c}
.two{display:grid;grid-template-columns:330px 1fr;gap:12px}
.panel{background:var(--plate);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;min-width:0}
.panel .ttl{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px}
.panel p.s{font-size:11.5px;color:#c3c8d0;line-height:1.55;margin-top:6px}
.cbT{width:100%;border-collapse:collapse;font-size:12px}
.cbT td,.cbT th{padding:7px 6px;border-top:1px solid var(--rule);text-align:left;vertical-align:top;line-height:1.45}
.cbT th{border-top:0;color:var(--mute);font-size:11px;font-weight:700}
.cbT td:first-child{font-weight:900;white-space:nowrap}
.cbT .r{font:700 13px var(--mono);color:var(--amber2);white-space:nowrap}
.mini{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.mini.five{grid-template-columns:repeat(5,1fr)}
.mini>div{background:var(--plate);border:1px solid var(--rule);border-radius:12px;padding:10px 11px;min-width:0}
.mini .k{font-size:11px;color:var(--mute);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .v{font:700 15px var(--mono);margin-top:3px;white-space:nowrap}
.mini .s{font:600 10.5px var(--mono);margin-top:2px;white-space:nowrap}
.mini .h{font-size:10px;color:#7c8594;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cal>div{background:var(--plate);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;position:relative}
.cal .d{font:700 12px var(--mono);color:var(--amber2)}
.cal .tg{position:absolute;right:10px;top:9px;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;background:#2b313b;color:var(--mute)}

/* ================= v2 오버라이드 ================= */
const ZC={g:'z-g',n:'z-n',w:'z-w',b:'z-b'};
function ruler(key){const r=DATA.rul[key];if(!r)return '';let prev=r.lo,span=r.hi-r.lo;
  const pos=Math.max(1,Math.min(99,(r.v-r.lo)/span*100));
  let zs='',zt='';r.z.forEach(([u,l,c])=>{const w=(Math.min(u,r.hi)-prev)/span*100;const on=r.v>=prev&&(r.v<u||u>=r.hi);
    zs+=`<i class="${ZC[c]}" style="width:${w}%"></i>`;zt+=`<span class="${on?'on':''}" style="width:${w}%">${(on||w>=22)?l:''}</span>`;prev=u});
  return `<div class="rl"><div class="zs">${zs}</div><div class="pin" style="left:${pos}%"></div><div class="zt">${zt}</div></div>`}
function parts(p,ttl){return `<div class="parts"><div class="ttl">${ttl||'점수는 이렇게 매겼어요'}</div>${p.map(([n,m,s,rule])=>`<div class="prow"><span>${n}</span><span class="s">${s}${m?'/'+m:'+'}</span><div class="bar"><i style="width:${m?s/m*100:100}%"></i></div>${rule?`<div class="rule-t">${rule}</div>`:''}</div>`).join('')}</div>`}
function histTxt(h,s){if(!h)return '';if(h.avg==null)return `<div class="hist">${h.label}<br>최근 1년 중 하위 <b>${h.pct}%</b></div>`;
  const diff=Math.round((h.now??s)-h.avg);return `<div class="hist">${h.label}<br>평균 <b>${h.avg}</b> · 범위 <b>${h.lo}~${h.hi}</b><br>평소보다 <b style="color:${diff<0?'var(--down)':'var(--up)'}">${diff>0?'+':''}${diff}점</b> · 하위 <b>${h.pct}%</b></div>`}
function gaugeBox(score,label,h){const g=grade(score);return `<div class="gauge"><div class="lbl">${label}</div>${dial(score)}<div class="grade" style="color:${g[1]}">${g[0]}</div>${histTxt(h,score)}</div>`}
/* --- v6: 점수 띠 (도넛 대신 가로 한 줄) --- */
function sband(score,label,h,what){
  const g=grade(score);
  const zones=[['방어 우선','0~39','z-b'],['경계','40~54','z-w'],['선별 매수','55~69','z-n'],['강세','70~100','z-g']];
  const avg=h&&h.avg!=null?h.avg:null, per=h&&h.n?(h.n<250?h.n+'일':'1년'):'1년';
  const ref=h&&h.now!=null?h.now:score;
  let msg=`${what||label} ${score}점은 '${g[0]}'`;
  if(avg!=null) msg+=` · 같은 방식으로 환산한 오늘 ${ref}점 vs ${per} 평균 ${avg}점 → ${ref<avg-10?'평소보다 훨씬 나쁜 환경':ref<avg?'평소보다 조금 나쁜 환경':ref<avg+10?'평소보다 조금 좋은 환경':'평소보다 훨씬 좋은 환경'}`;
  let stats='';
  if(h){ if(h.avg!=null){const diff=Math.round(ref-h.avg);
      stats=`${h.label||''}<br>평균 <b>${h.avg}</b> · 범위 <b>${h.lo}~${h.hi}</b><br>평소보다 <b style="color:${diff<0?'var(--down)':'var(--up)'}">${diff>0?'+':''}${diff}점</b> · 하위 <b>${h.pct}%</b>`}
    else stats=`${h.label||''}<br>최근 1년 중 하위 <b>${h.pct}%</b>` }
  return `<div class="sband${stats?'':' tw'}">
   <div class="sl"><div class="lbl">${label}</div><div class="big"><b class="num" style="color:${g[1]}">${score}</b><i>/100</i></div><span class="gd" style="color:${g[1]}">${g[0]}</span></div>
   <div class="sr"><div class="zbar">
     <div class="zs">${zones.map(z=>`<i class="${z[2]}"><span>${z[0]}</span><em>${z[1]}</em></i>`).join('')}</div>
     ${avg!=null?`<div class="mk avg" style="left:${avg}%"><i></i><span>${per} 평균 ${avg}</span></div>`:''}
     <div class="mk now" style="left:${score}%"><span>오늘 ${score}</span><i></i></div></div>
    <div class="zmsg">${msg}</div></div>
   ${stats?`<div class="ss">${stats}</div>`:''}</div>`}
function top3(score,label,p,dg,h){return sband(score,label,h,label)+`<div class="two even">${parts(p)}${diag(dg)}</div>`}
function scaleBar(){return ''}  /* v6: sband가 대체 */
function kpiR(k){return k.map(([n,v,c,key,hint])=>`<div class="kpi"><div class="k">${n}</div><div class="v">${v}</div><div class="s ${c==null?'':cls(c)}">${c==null?'':pct(c)}${hint?`<span class="hn">${hint}</span>`:''}</div>${key?ruler(key):''}</div>`).join('')}
/* ---------- squarified treemap ---------- */
function squarify(items,x,y,w,h){const total=items.reduce((a,b)=>a+b.v,0);if(!items.length||total<=0)return[];
  const area=w*h;const it=items.map(o=>({...o,a:o.v/total*area}));const out=[];
  function worst(row,side){const s=row.reduce((a,b)=>a+b.a,0),mx=Math.max(...row.map(r=>r.a)),mn=Math.min(...row.map(r=>r.a));return Math.max(side*side*mx/(s*s),(s*s)/(side*side*mn))}
  function lay(row,rx,ry,rw,rh){const s=row.reduce((a,b)=>a+b.a,0);if(rw>=rh){const cw=s/rh;let cy=ry;row.forEach(r=>{const ch=r.a/cw;out.push({...r,x:rx,y:cy,w:cw,h:ch});cy+=ch});return[rx+cw,ry,rw-cw,rh]}
    else{const ch=s/rw;let cx=rx;row.forEach(r=>{const cw2=r.a/ch;out.push({...r,x:cx,y:ry,w:cw2,h:ch});cx+=cw2});return[rx,ry+ch,rw,rh-ch]}}
  let rect=[x,y,w,h],row=[],i=0;
  while(i<it.length){const side=Math.min(rect[2],rect[3]);const c=it[i];
    if(!row.length||worst([...row,c],side)<=worst(row,side)){row.push(c);i++}else{rect=lay(row,...rect);row=[]}}
  if(row.length)lay(row,...rect);return out}
function ccls(c,strong){return c>=strong?'c-su':c>0?'c-u':c===0?'c-f':c>-strong?'c-d':'c-sd'}
function fitPct(c,w,ps){let s=pct(c);if(s.length*ps*0.62>w-6){s=(c>0?'+':'')+c.toFixed(1)+'%';}if(s.length*ps*0.62>w-4){s=(c>0?'+':'')+Math.round(c)+'%';}return s.length*ps*0.6>w-2?'':s}
function pctBox(r,W,H){return `left:${(r.x/W*100).toFixed(4)}%;top:${(r.y/H*100).toFixed(4)}%;width:${(r.w/W*100).toFixed(4)}%;height:${(r.h/H*100).toFixed(4)}%`}
function tileHTML(r,chgKey,strong,showPx,W,H){const a=r.w*r.h,c=r[chgKey];let fs=Math.max(10,Math.min(26,Math.sqrt(a)/6.2));

  else if(r.h>=16){const pv=fitPct(c,r.w,9);if(pv)inner=`<div class="p" style="font-size:9px">${pv}</div>`}

function curveSVG(c){const W=300,H=130,P=26;const all=[...c.now,...c.prev].map(x=>x[1]);const lo=Math.floor(Math.min(...all)*10)/10-0.1,hi=Math.ceil(Math.max(...all)*10)/10+0.1;

  const path=a=>a.map((p,i)=>`${i?'L':'M'}${X(i)},${Y(p[1])}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}"><path d="${path(c.prev)}" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>

   ${c.now.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p[1])}" r="4" fill="var(--amber2)"/><text x="${X(i)}" y="${Y(p[1])-9}" fill="#ebe7df" font-size="11" font-family="IBM Plex Mono" font-weight="700" text-anchor="middle">${p[1].toFixed(2)}</text><text x="${X(i)}" y="${H-5}" fill="#8d96a5" font-size="10.5" text-anchor="middle">${p[0]}</text>`).join('')}</svg>`}

    document.querySelectorAll('#crk [data-kc]').forEach(el=>{const q=P[el.dataset.kc];if(q){el.textContent='24시간 '+pct(q.c);el.className='s '+cls(q.c)}});

      tr.querySelector('.px').textContent=fmt(q.p,'CR');const pc=tr.querySelector('.pc');pc.textContent=pct(q.c);pc.className='pc '+cls(q.c)});
    document.querySelectorAll('#crk [data-k]').forEach(el=>{const q=P[el.dataset.k];if(q)el.textContent=fmt(q.p,'CR')});
    document.querySelectorAll('#crk [data-kc]').forEach(el=>{const q=P[el.dataset.kc];if(q){el.textContent='24시간 '+pct(q.c);el.className='s '+cls(q.c)}});
