name: Argon 데일리 자동 갱신

on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: argon-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 1) 데이터 수집
        run: python argon/fetch.py
      - name: 2) 점수·추천·가상계좌·페이지 생성
        run: python argon/build.py
      - name: 3) 가상계좌 원장 저장
        continue-on-error: true
        run: |
          git config user.name  "argon-bot"
          git config user.email "argon-bot@users.noreply.github.com"
          git add state/ledger.json
          git commit -m "ledger: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST" || echo "변경 없음"
          git push || echo "원장 저장 건너뜀"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
